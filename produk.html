<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Produk - TokoKelompok</title>
    
    <!-- CDN Resmi Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Class Efek Hover Kartu Produk */
        .product-card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card-hover:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- [TUGAS SISWA B] - SECTION KATALOG PRODUK -->
    <section class="py-12 md:py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <!-- Judul Section -->
            <div class="text-center max-w-2xl mx-auto mb-12">
                <span class="inline-block py-1 px-3 bg-indigo-100 text-indigo-700 font-semibold text-xs rounded-full mb-3 uppercase tracking-wider">
                    Katalog Unggulan
                </span>
                <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight mb-3">
                    Produk Pilihan Kami
                </h2>
                <p class="text-slate-600 text-base">
                    Temukan produk terbaik dengan kualitas terjamin untuk mendukung aktivitas harian Anda.
                </p>
            </div>
            
            <!-- Grid Produk -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 justify-items-center">
                
                <!-- Kartu Produk 1 -->
                <div class="product-card-hover bg-white rounded-2xl overflow-hidden border border-slate-200/80 shadow-sm w-full max-w-sm flex flex-col justify-between">
                    <div>
                        <div class="relative bg-slate-100 aspect-video overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" alt="Headphone Wireless" class="w-full h-56 object-cover transition-transform duration-500 hover:scale-105">
                        </div>
                        <div class="p-6">
                            <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider bg-indigo-50 px-2.5 py-1 rounded-md">Elektronik</span>
                            <h3 class="text-lg font-bold text-slate-900 mt-3 mb-2 line-clamp-2">Headphone Wireless Premium</h3>
                            <p class="text-2xl font-black text-indigo-600">Rp 1.500.000</p>
                        </div>
                    </div>
                    <div class="p-6 pt-0">
                        <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-sm shadow-indigo-200 flex items-center justify-center gap-2">
                            <span>🛒</span> Beli Sekarang
                        </button>
                    </div>
                </div>

                <!-- Kartu Produk 2 -->
                <div class="product-card-hover bg-white rounded-2xl overflow-hidden border border-slate-200/80 shadow-sm w-full max-w-sm flex flex-col justify-between">
                    <div>
                        <div class="relative bg-slate-100 aspect-video overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500&q=80" alt="Jaket Bomber" class="w-full h-56 object-cover transition-transform duration-500 hover:scale-105">
                        </div>
                        <div class="p-6">
                            <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider bg-indigo-50 px-2.5 py-1 rounded-md">Pakaian</span>
                            <h3 class="text-lg font-bold text-slate-900 mt-3 mb-2 line-clamp-2">Jaket Bomber Keren</h3>
                            <p class="text-2xl font-black text-indigo-600">Rp 450.000</p>
                        </div>
                    </div>
                    <div class="p-6 pt-0">
                        <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-sm shadow-indigo-200 flex items-center justify-center gap-2">
                            <span>🛒</span> Beli Sekarang
                        </button>
                    </div>
                </div>

                <!-- Kartu Produk 3 -->
                <div class="product-card-hover bg-white rounded-2xl overflow-hidden border border-slate-200/80 shadow-sm w-full max-w-sm flex flex-col justify-between">
                    <div>
                        <div class="relative bg-slate-100 aspect-video overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" alt="Jam Tangan" class="w-full h-56 object-cover transition-transform duration-500 hover:scale-105">
                        </div>
                        <div class="p-6">
                            <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider bg-indigo-50 px-2.5 py-1 rounded-md">Aksesoris</span>
                            <h3 class="text-lg font-bold text-slate-900 mt-3 mb-2 line-clamp-2">Jam Tangan Minimalis</h3>
                            <p class="text-2xl font-black text-indigo-600">Rp 850.000</p>
                        </div>
                    </div>
                    <div class="p-6 pt-0">
                        <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-sm shadow-indigo-200 flex items-center justify-center gap-2">
                            <span>🛒</span> Beli Sekarang
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </section>

</body>
</html>
