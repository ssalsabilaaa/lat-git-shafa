<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Produk</title>
    <style>
        /* ==========================================================================
           1. KODE CSS (Desain dan Tampilan)
           ========================================================================== */
        
        /* Pengaturan Dasar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Desain Section Produk */
        .products-section {
            padding: 60px 0;
            background-color: #f9f9f9;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            color: #333;
            margin-bottom: 10px;
        }

        .section-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        /* Layout Grid menggunakan Flexbox */
        .products-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        /* Desain Kartu Produk */
        .product-card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            width: 300px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Efek saat Kursor Mengarah ke Kartu */
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .product-image img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-category {
            font-size: 0.8rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 5px;
        }

        .product-name {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
            height: 50px; /* Menjaga tinggi nama produk agar sejajar */
            overflow: hidden;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ff5722;
            margin-bottom: 15px;
        }

        /* Desain Tombol Beli */
        .btn-buy {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-buy:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
       2. KODE HTML (Struktur Halaman)
       ========================================================================== -->
    <section class="products-section">
        <div class="container">
            <h2 class="section-title">Produk Pilihan Kami</h2>
            <p class="section-subtitle">Temukan produk terbaik dengan kualitas terjamin untuk Anda</p>
            
            <div class="products-grid">
                <!-- Kartu Produk 1 -->
                <div class="product-card">
                    <div class="product-image">
                        <!-- placeholder.com digunakan sebagai gambar sementara, bisa diganti nanti -->
                        <img src="https://placeholder.com" alt="Produk 1">
                    </div>
                    <div class="product-info">
                        <span class="product-category">Elektronik</span>
                        <h3 class="product-name">Headphone Wireless Premium</h3>
                        <p class="product-price">Rp 1.500.000</p>
                        <button class="btn-buy">Beli Sekarang</button>
                    </div>
                </div>

                <!-- Kartu Produk 2 -->
                <div class="product-card">
                    <div class="product-image">
                        <img src="https://placeholder.com" alt="Produk 2">
                    </div>
                    <div class="product-info">
                        <span class="product-category">Pakaian</span>
                        <h3 class="product-name">Jaket Bomber Keren</h3>
                        <p class="product-price">Rp 450.000</p>
                        <button class="btn-buy">Beli Sekarang</button>
                    </div>
                </div>

                <!-- Kartu Produk 3 -->
                <div class="product-card">
                    <div class="product-image">
                        <img src="https://placeholder.com" alt="Produk 3">
                    </div>
                    <div class="product-info">
                        <span class="product-category">Aksesoris</span>
                        <h3 class="product-name">Jam Tangan Minimalis</h3>
                        <p class="product-price">Rp 850.000</p>
                        <button class="btn-buy">Beli Sekarang</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
